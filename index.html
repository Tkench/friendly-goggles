<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Last Brick</title>
  <meta name="description" content="Track missing pieces for your LEGO sets and find out which set a piece belongs to.">
  <meta name="theme-color" content="#d01012">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Last Brick">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="back hidden" id="backBtn" aria-label="Back">‹</button>
    <h1 id="title">Last Brick</h1>
    <span class="spacer"></span>
    <button class="topbtn hidden" id="delBtn" aria-label="Delete this set">🗑</button>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="sets"><span class="ico"><svg class="tab-bricks" viewBox="0 0 28 24" aria-hidden="true">
      <rect x="2" y="13" width="11" height="8" rx="1.5" fill="#f6c31b" stroke="#c99a06" stroke-width="1.2"/><rect x="15" y="13" width="11" height="8" rx="1.5" fill="#2f80d1" stroke="#1d5ea3" stroke-width="1.2"/>
      <rect x="4" y="11" width="3.5" height="2.5" rx=".8" fill="#f6c31b" stroke="#c99a06" stroke-width="1"/><rect x="20.5" y="11" width="3.5" height="2.5" rx=".8" fill="#2f80d1" stroke="#1d5ea3" stroke-width="1"/>
      <rect x="7" y="5" width="14" height="8" rx="1.5" fill="#d9312b" stroke="#a61f1b" stroke-width="1.2"/>
      <rect x="9" y="2.5" width="3.5" height="2.8" rx=".8" fill="#d9312b" stroke="#a61f1b" stroke-width="1"/><rect x="15.5" y="2.5" width="3.5" height="2.8" rx=".8" fill="#d9312b" stroke="#a61f1b" stroke-width="1"/>
    </svg></span>Sets</button>
    <button data-tab="missing"><span class="ico"><svg class="tab-svg" viewBox="0 0 28 26" aria-hidden="true">
      <circle cx="11.5" cy="11" r="7.5" fill="#dceeff" stroke="#2f80d1" stroke-width="3"/>
      <path d="M8 8.5a4.5 4.5 0 0 1 4-2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="17.2" y="16" width="5" height="10" rx="2" transform="rotate(-45 19.7 21)" fill="#d9312b" stroke="#a61f1b" stroke-width="1.2"/>
    </svg></span>Looking for</button>
    <button data-tab="scan"><span class="ico"><svg class="tab-svg" viewBox="0 0 28 26" aria-hidden="true">
      <rect x="9" y="3.5" width="9" height="4" rx="1.5" fill="#d9312b" stroke="#a61f1b" stroke-width="1.2"/>
      <rect x="2" y="6.5" width="24" height="16" rx="3.5" fill="#d9312b" stroke="#a61f1b" stroke-width="1.4"/>
      <circle cx="14" cy="14.5" r="5.6" fill="#2f80d1" stroke="#fff" stroke-width="2"/>
      <circle cx="12.3" cy="12.8" r="1.4" fill="#fff" opacity=".8"/>
      <rect x="20.5" y="9" width="3" height="2.2" rx=".8" fill="#f6c31b"/>
    </svg></span>Scan</button>
    <button data-tab="settings"><span class="ico"><svg class="tab-svg" viewBox="0 0 28 26" aria-hidden="true">
      <g transform="translate(14 13)">
        <g fill="#3aa64a" stroke="#277a34" stroke-width="1.2">
          <rect x="-2.6" y="-11.5" width="5.2" height="5" rx="1.2"/><rect x="-2.6" y="6.5" width="5.2" height="5" rx="1.2"/>
          <rect x="-11.5" y="-2.6" width="5" height="5.2" rx="1.2"/><rect x="6.5" y="-2.6" width="5" height="5.2" rx="1.2"/>
          <rect x="-2.6" y="-11.5" width="5.2" height="5" rx="1.2" transform="rotate(45)"/><rect x="-2.6" y="6.5" width="5.2" height="5" rx="1.2" transform="rotate(45)"/>
          <rect x="-11.5" y="-2.6" width="5" height="5.2" rx="1.2" transform="rotate(45)"/><rect x="6.5" y="-2.6" width="5" height="5.2" rx="1.2" transform="rotate(45)"/>
          <circle r="8"/>
        </g>
        <circle r="3.4" fill="#f6c31b" stroke="#c99a06" stroke-width="1.2"/>
      </g>
    </svg></span>Settings</button>
  </nav>

  <div id="toast" class="toast hidden"></div>
  <div id="sheet" class="sheet hidden"></div>

  <!-- Hidden camera input used by the Scan screen -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>

  <script src="app.js"></script>
</body>
</html>
